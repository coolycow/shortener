syntax = "proto3";

package shortener;

option go_package = "github.com/coolycow/shortener/internal/proto/shortenerpb;shortenerpb";

// Генерация Go (Opaque API): protoc -Iproto -Ithird_party/protobuf/src
//   --go_out=. --go_opt=module=github.com/coolycow/shortener --go_opt=default_api_level=API_OPAQUE
//   --go-grpc_out=. --go-grpc_opt=module=github.com/coolycow/shortener proto/shortener.proto

import "google/protobuf/empty.proto";

// ShortenerService mirrors POST /api/shorten, GET /:id, GET /api/user/urls.
service ShortenerService {
  rpc ShortenURL (URLShortenRequest) returns (URLShortenResponse);
  rpc ExpandURL (URLExpandRequest) returns (URLExpandResponse);
  rpc ListUserURLs (google.protobuf.Empty) returns (UserURLsResponse);
}

message URLShortenRequest {
  string url = 1;
}

message URLShortenResponse {
  string result = 1;
}

message URLExpandRequest {
  string id = 1;
}

message URLExpandResponse {
  string result = 1;
}

message UserURLsResponse {
  repeated URLData url = 1;
}

message URLData {
  string short_url = 1;
  string original_url = 2;
}
